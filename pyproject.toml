[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diskgrip"
version = "0.0.1"
description = "Visual block-storage management for Linux — a sibling to netgrip."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ross Young", email = "rossandrewyoung@gmail.com" }]
keywords = ["linux", "storage", "disk", "lsblk", "partitions", "gparted"]
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.5"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
diskgrip = "diskgrip.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
